# 重置博客后台管理员账号（忘记密码时使用）
# 用法：仓库 Actions 页选择「重置后台账号」→ Run workflow
# 原理：重新部署 Worker 时注入一次性标志 ADMIN_RESET_ONCE，Worker 首个请求收到后
#       自行把 bl_Admin 表重置为 admin/admin（不依赖 CF_API_TOKEN 的 D1 写权限）
# 结果：用户名 admin / 密码 admin（登录后请立即在 设置→管理员账号 修改）
name: 重置后台账号

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 部署 Worker（注入一次性重置标志）
        working-directory: blog-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -e
          npm install --no-audit --no-fund
          FLAG="reset-$(date +%s)"
          echo "FLAG=$FLAG" >> "$GITHUB_ENV"
          # GH_REPO 需要重新注入：deploy 会用配置覆盖 vars
          npx wrangler deploy --var ADMIN_RESET_ONCE:$FLAG --var GH_REPO:${{ github.repository }}

      - name: 触发重置（请求一次 Worker 使标志生效）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          SUB=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result.subdomain // empty')
          if [ -n "$SUB" ]; then
            curl -s -m 30 "https://blog-worker.${SUB}.workers.dev/api/health" >/dev/null \
              && echo "已请求 workers.dev 健康检查，重置已执行"
          else
            echo "未查询到 workers.dev 子域，跳过自动触发（你访问后台时也会自动触发重置）"
          fi
          echo "后台账号已重置 -> 用户名 admin / 密码 admin"
