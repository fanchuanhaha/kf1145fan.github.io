# 重置博客后台管理员账号（忘记密码时使用）
# 用法：仓库 Actions 页选择「重置后台账号」→ Run workflow
# 效果：清空后台账号表，重建为 用户名 admin / 密码 admin（登录后请立即在 设置→管理员账号 修改）
name: 重置后台账号

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # wrangler.toml 里的 database_id 是占位符，真实 id 保存在 Cloudflare 侧；
      # 与 update-cf.yml 一致：先查询真实 id 并临时回填，否则 API 报 7403
      - name: Ensure D1 database (自动查询并回填 database_id)
        working-directory: blog-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID_VAR: ${{ vars.D1_DATABASE_ID }}
        run: |
          set -e
          DB_NAME="blog-db"
          ID="${D1_DATABASE_ID_VAR:-}"
          if [ -z "$ID" ]; then
            API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
            RESP="$(curl -s "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" || true)"
            ID="$(printf '%s' "$RESP" | jq -r --arg n "$DB_NAME" '.result[]? | select(.name==$n) | .uuid' 2>/dev/null | head -1)"
          fi
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "::error::无法获取 D1 库 $DB_NAME 的 id。请设置仓库变量 D1_DATABASE_ID（或让 CF_API_TOKEN 具备 D1:Edit 权限）"
            exit 1
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/g" wrangler.toml
          echo "D1 database_id -> $ID"

      - name: 重置管理员账号为 admin/admin
        working-directory: blog-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # 生成与 Worker 相同格式的 PBKDF2-SHA256 哈希：$pbkdf2$100000$base64(salt16)$base64(hash32)
          HASH=$(node -e 'const c=require("crypto");const s=c.randomBytes(16);const h=c.pbkdf2Sync("admin",s,100000,32,"sha256");process.stdout.write("$pbkdf2$100000$"+s.toString("base64")+"$"+h.toString("base64"))')
          npx wrangler d1 execute blog-db --remote --command "DROP TABLE IF EXISTS bl_Admin; CREATE TABLE bl_Admin (id INTEGER PRIMARY KEY AUTOINCREMENT, username TEXT NOT NULL DEFAULT '', password TEXT NOT NULL DEFAULT '', createdAt TEXT DEFAULT (datetime('now')), updatedAt TEXT DEFAULT (datetime('now'))); CREATE UNIQUE INDEX idx_bl_admin_username ON bl_Admin (username); INSERT INTO bl_Admin (username, password) VALUES ('admin', '$HASH');"
          echo "后台账号已重置 -> 用户名 admin / 密码 admin"
